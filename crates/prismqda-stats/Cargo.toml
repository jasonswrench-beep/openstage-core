edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"
authors = ["Jason S. Wrench", "the PrismQDA contributors"]
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
serde_json = "1.0.154"
