[package]
name = "openstage-a11y"
version = "0.1.0"
description = "The OpenStage accessibility rules (A11Y-1): checks a web page, a help site, an EPUB, a Word or PowerPoint file and a WebVTT captions file, and returns findings that warn and never block."
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Jason S. Wrench"]
repository = "https://github.com/jasonswrench-beep/openstage-core"
publish = false

[lib]
name = "openstage_a11y"

[[bin]]
name = "openstage-a11y"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1.1"
